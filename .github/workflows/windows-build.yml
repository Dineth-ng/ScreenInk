name: Windows candidate build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -q
      - run: python main.py --smoke-test
      - run: python tools/build_beta.py
      - run: ./tools/setup_inno.ps1
      - run: python tools/build_installer.py --iscc build/tools/InnoSetup/ISCC.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenInk-windows-candidate
          path: release/*
          if-no-files-found: error
          retention-days: 14
